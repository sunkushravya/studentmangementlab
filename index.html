<!DOCTYPE html>
<html>
<head>
    <title>Student Information</title>
</head>
<body>

    <h2>Student Details Form</h2>

    <form>
        <!-- Name -->
        <label>Name:</label><br>
        <input type="text" name="name"><br><br>

        <!-- Description -->
        <label>Description:</label><br>
        <textarea rows="4" cols="30"></textarea><br><br>

        <!-- Gender -->
        <label>Gender:</label><br>
        <input type="radio" name="gender"> Male<br>
        <input type="radio" name="gender"> Female<br>
        <input type="radio" name="gender"> Other<br><br>

        <!-- Skills using Radio Buttons -->
        <label>Skills:</label><br>
        <input type="radio" name="skill"> HTML<br>
        <input type="radio" name="skill"> CSS<br>
        <input type="radio" name="skill"> JavaScript<br>
        <input type="radio" name="skill"> Python<br><br>

        <input type="submit" value="Submit">
    </form>

    <hr>

    <h2>Marks Table</h2>

    <table border="1" cellpadding="8">
        <tr>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Maths</td>
            <td>85</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>90</td>
        </tr>
        <tr>
            <td>English</td>
            <td>88</td>
        </tr>
        <tr>
            <td>Computer</td>
            <td>95</td>
        </tr>
        <tr>
            <td>Social Studies</td>
            <td>80</td>
        </tr>
    </table>

</body>
</html>
